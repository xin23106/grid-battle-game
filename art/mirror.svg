<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640">
  <defs>
    <radialGradient id="aura" cx="50%" cy="46%" r="56%">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity=".5"/>
      <stop offset=".42" stop-color="#7c3aed" stop-opacity=".22"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset=".45" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset=".28" stop-color="#c4b5fd"/>
      <stop offset=".6" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#e0e7ff"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d2b8"/>
      <stop offset="1" stop-color="#b9825c"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#020617" flood-opacity=".6"/></filter>
  </defs>

  <ellipse cx="240" cy="350" rx="205" ry="225" fill="url(#aura)" filter="url(#soft)"/>
  <ellipse cx="240" cy="596" rx="136" ry="18" fill="#020617" opacity=".6" filter="url(#soft)"/>

  <!-- mirror shards background -->
  <g opacity=".75" filter="url(#glow)">
    <path d="M70 140 L116 108 L132 172 L88 182 Z" fill="#c4b5fd" opacity=".28" stroke="#f5f3ff" stroke-width="1.5"/>
    <path d="M360 120 L408 96 L420 158 L374 168 Z" fill="#8b5cf6" opacity=".28" stroke="#f5f3ff" stroke-width="1.5"/>
    <path d="M80 420 L124 390 L138 448 L96 460 Z" fill="#c4b5fd" opacity=".22" stroke="#f5f3ff" stroke-width="1.5"/>
    <path d="M354 420 L398 392 L416 452 L372 464 Z" fill="#a78bfa" opacity=".22" stroke="#f5f3ff" stroke-width="1.5"/>
    <circle cx="240" cy="82" r="4" fill="#f5f3ff"/><circle cx="64" cy="274" r="3" fill="#c4b5fd"/><circle cx="420" cy="300" r="3" fill="#c4b5fd"/>
  </g>

  <!-- cape -->
  <path d="M158 250 C104 310 94 442 114 556 C152 574 328 574 366 556 C386 442 376 310 322 250 C286 272 194 272 158 250 Z" fill="url(#robe)" stroke="#1e1b4b" stroke-width="4"/>
  <path d="M166 264 C128 326 120 458 134 544" stroke="#c4b5fd" stroke-width="3" opacity=".8" fill="none"/>
  <path d="M314 264 C352 326 360 458 346 544" stroke="#c4b5fd" stroke-width="3" opacity=".8" fill="none"/>

  <!-- legs -->
  <path d="M194 440 C186 488 188 534 196 578 L232 578 C228 528 226 480 234 442 Z" fill="#1e1b4b" stroke="#6d28d9" stroke-width="3"/>
  <path d="M246 442 C254 486 252 532 260 578 L296 578 C302 532 302 486 286 440 Z" fill="#111827" stroke="#6d28d9" stroke-width="3"/>
  <path d="M190 574 L234 574 L238 598 L180 598 Q176 584 190 574 Z" fill="#020617" stroke="#c4b5fd" stroke-width="3"/>
  <path d="M256 574 L300 574 L314 598 L252 598 Q244 584 256 574 Z" fill="#020617" stroke="#c4b5fd" stroke-width="3"/>

  <!-- robe / skirt -->
  <path d="M176 386 Q240 362 304 386 L316 456 Q240 488 164 456 Z" fill="#1e1b4b" stroke="#6d28d9" stroke-width="3"/>
  <path d="M174 386 Q240 412 306 386" stroke="url(#glass)" stroke-width="6" fill="none"/>
  <path d="M206 430 L240 470 L274 430" stroke="#c4b5fd" stroke-width="3" fill="none" opacity=".9"/>
  <path d="M196 510 L206 550 M240 512 L240 556 M284 510 L274 550" stroke="#a78bfa" stroke-width="2" opacity=".7"/>

  <!-- torso -->
  <path d="M174 270 Q204 238 240 232 Q276 238 306 270 L298 382 Q240 414 182 382 Z" fill="#111827" stroke="#7c3aed" stroke-width="4" filter="url(#shadow)"/>
  <path d="M188 282 Q240 254 292 282 L287 334 Q240 354 193 334 Z" fill="#1e1b4b" stroke="#c4b5fd" stroke-width="2"/>
  <path d="M192 348 Q240 374 288 348" stroke="url(#glass)" stroke-width="5" fill="none"/>
  <path d="M206 296 Q240 322 274 296 Q268 340 240 348 Q212 340 206 296 Z" fill="#312e81" stroke="#c4b5fd" stroke-width="3"/>
  <path d="M240 294 L252 316 L278 320 L258 338 L264 364 L240 350 L216 364 L222 338 L202 320 L228 316 Z" fill="#f5f3ff" filter="url(#glow)"/>

  <!-- shoulders / arms -->
  <path d="M160 270 Q184 238 216 254 L208 298 Q180 304 158 292 Z" fill="#111827" stroke="#7c3aed" stroke-width="3"/>
  <path d="M320 270 Q296 238 264 254 L272 298 Q300 304 322 292 Z" fill="#111827" stroke="#7c3aed" stroke-width="3"/>
  <path d="M164 276 Q184 258 207 266" stroke="#c4b5fd" stroke-width="4" fill="none"/>
  <path d="M316 276 Q296 258 273 266" stroke="#c4b5fd" stroke-width="4" fill="none"/>
  <path d="M162 292 Q142 342 157 394 L188 386 Q176 342 184 302 Z" fill="#1e1b4b" stroke="#6d28d9" stroke-width="3"/>
  <path d="M318 292 Q338 342 323 394 L292 386 Q304 342 296 302 Z" fill="#1e1b4b" stroke="#6d28d9" stroke-width="3"/>
  <path d="M151 386 Q160 414 182 419 Q193 407 184 390 Z" fill="url(#skin)" stroke="#b9825c" stroke-width="2"/>
  <path d="M329 386 Q320 414 298 419 Q287 407 296 390 Z" fill="url(#skin)" stroke="#b9825c" stroke-width="2"/>

  <!-- hand mirror / shard -->
  <g filter="url(#glow)">
    <path d="M154 250 L154 420" stroke="#c4b5fd" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="154" cy="196" rx="43" ry="62" fill="url(#glass)" stroke="#f5f3ff" stroke-width="3"/>
    <ellipse cx="154" cy="196" rx="34" ry="52" fill="#c4b5fd" opacity=".24"/>
    <path d="M132 158 Q154 140 178 162 L170 230 Q154 246 138 230 Z" fill="#f5f3ff" opacity=".35"/>
    <path d="M154 420 L142 450 M154 420 L166 450" stroke="#c4b5fd" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- head / hood -->
  <path d="M196 174 Q194 120 240 112 Q286 120 284 174 L272 214 Q240 232 208 214 Z" fill="url(#skin)" stroke="#b9825c" stroke-width="3"/>
  <path d="M192 176 Q190 104 240 98 Q294 104 289 176 Q272 148 240 146 Q213 146 192 176 Z" fill="#e0e7ff" stroke="#818cf8" stroke-width="2"/>
  <path d="M198 160 Q214 132 240 132 Q270 132 285 160 Q270 148 240 148 Q210 148 198 160 Z" fill="#f8fafc" opacity=".9"/>
  <path d="M202 192 Q214 202 226 194 M254 194 Q266 202 278 192" stroke="#6d28d9" stroke-width="3" fill="none" stroke-linecap="round"/>
  <ellipse cx="220" cy="181" rx="4" ry="2.6" fill="#7c3aed"/><ellipse cx="260" cy="181" rx="4" ry="2.6" fill="#7c3aed"/>
  <path d="M231 207 Q240 213 249 207" stroke="#9f1239" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M214 218 Q240 232 266 218" stroke="#c4b5fd" stroke-width="3" fill="none"/>

  <!-- crown of mirror shards -->
  <path d="M202 142 L214 104 L228 132 L240 90 L252 132 L266 104 L278 142 L260 150 Q240 134 220 150 Z" fill="url(#glass)" stroke="#f5f3ff" stroke-width="2"/>
  <path d="M240 94 L248 112 L266 116 L252 130 L256 150 L240 138 L224 150 L228 130 L214 116 L232 112 Z" fill="#f5f3ff" opacity=".9"/>

  <!-- particles -->
  <g fill="#f5f3ff" filter="url(#glow)">
    <circle cx="326" cy="304" r="2.5"/><circle cx="350" cy="340" r="1.8"/><circle cx="326" cy="372" r="2.2"/>
    <circle cx="142" cy="326" r="2"/><circle cx="124" cy="360" r="1.7"/>
  </g>
</svg>
