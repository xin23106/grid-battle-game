<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" width="480" height="640">
<defs>
  <radialGradient id="aura" cx="50%" cy="62%" r="50%">
    <stop offset="0%" stop-color="#c4b5fd" stop-opacity=".26"/>
    <stop offset="45%" stop-color="#a78bfa" stop-opacity=".12"/>
    <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="cloak" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#4c1d95"/>
  </linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="rim" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#c4b5fd" flood-opacity=".8"/>
  </filter>
  <style>
  .hf-cloak{fill:url(#cloak);opacity:.96;stroke:rgba(255,255,255,.18);stroke-width:.45}
  .hf-cape,.hf-back-cape{fill:#4c1d95;opacity:.88}
  .hf-armor{fill:#4c1d95;stroke:#c4b5fd;stroke-width:.9}
  .hf-shoulder{fill:#4c1d95;stroke:#c4b5fd;stroke-width:.8}
  .hf-robe{fill:#4c1d95;opacity:.94}
  .hf-belt{stroke:#c4b5fd;stroke-width:2;fill:none;opacity:.8}
  .hf-leg{stroke:#4c1d95;stroke-width:3;stroke-linecap:round;fill:none}
  .hf-neck{fill:#4c1d95}
  .hf-head{fill:#a78bfa;opacity:.55}
  .hf-hood{fill:#a78bfa;opacity:.96}
  .hf-helm{fill:#4c1d95;stroke:#c4b5fd;stroke-width:.9}
  .hf-visor{fill:#070b16}
  .hf-plume{fill:#c4b5fd}
  .hf-mask{fill:#4c1d95;stroke:#c4b5fd;stroke-width:.7}
  .hf-eye-slit{stroke:#c4b5fd;stroke-width:1.3}
  .hf-horn{fill:#4c1d95;stroke:#c4b5fd;stroke-width:.6}
  .hf-hat{fill:#4c1d95;stroke:#c4b5fd;stroke-width:.8}
  .hf-crown{fill:#c4b5fd}
  .hf-halo{fill:none;stroke:#c4b5fd;stroke-width:1.4;opacity:.9}
  .hf-eye{fill:#c4b5fd;filter:drop-shadow(0 0 2px #c4b5fd)}
  .hf-wing{fill:#4c1d95;stroke:#c4b5fd;stroke-width:.7;opacity:.95}
  .hf-scarf{fill:#a78bfa;opacity:.9}
  .hf-float-orb{fill:#c4b5fd;filter:drop-shadow(0 0 5px #c4b5fd)}
  .hf-tail{fill:#a78bfa;opacity:.8}
  .hf-sigil{fill:#c4b5fd;opacity:.95}
  .hf-sigil-dot{fill:#070b16}
  .hf-sigil-ring{fill:none;stroke:#c4b5fd;stroke-width:1.4}
  .hf-sigil-line{stroke:#c4b5fd;stroke-width:1.5;fill:none;stroke-linecap:round}
  .hf-wpn-fill{fill:#c4b5fd;opacity:.96}
  .hf-wpn-line{stroke:#c4b5fd;stroke-width:2.2;stroke-linecap:round;fill:none}
  .hf-wpn-line.thin{stroke-width:1;opacity:.75}
  .hf-wpn-glow{fill:none;stroke:#c4b5fd;stroke-width:1;opacity:.35}
  .hf-shadow{fill:rgba(0,0,0,.5)}
</style>
</defs>
