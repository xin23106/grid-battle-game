<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" width="480" height="640">
<defs>
  <radialGradient id="aura" cx="50%" cy="62%" r="50%">
    <stop offset="0%" stop-color="#e0f2fe" stop-opacity=".26"/>
    <stop offset="45%" stop-color="#60a5fa" stop-opacity=".12"/>
    <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="cloak" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#60a5fa"/><stop offset="100%" stop-color="#7c3aed"/>
  </linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="rim" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#e0f2fe" flood-opacity=".8"/>
  </filter>
  <style>
  .hf-cloak{fill:url(#cloak);opacity:.96;stroke:rgba(255,255,255,.18);stroke-width:.45}
  .hf-cape,.hf-back-cape{fill:#7c3aed;opacity:.88}
  .hf-armor{fill:#7c3aed;stroke:#e0f2fe;stroke-width:.9}
  .hf-shoulder{fill:#7c3aed;stroke:#e0f2fe;stroke-width:.8}
  .hf-robe{fill:#7c3aed;opacity:.94}
  .hf-belt{stroke:#e0f2fe;stroke-width:2;fill:none;opacity:.8}
  .hf-leg{stroke:#7c3aed;stroke-width:3;stroke-linecap:round;fill:none}
  .hf-neck{fill:#7c3aed}
  .hf-head{fill:#60a5fa;opacity:.55}
  .hf-hood{fill:#60a5fa;opacity:.96}
  .hf-helm{fill:#7c3aed;stroke:#e0f2fe;stroke-width:.9}
  .hf-visor{fill:#070b16}
  .hf-plume{fill:#e0f2fe}
  .hf-mask{fill:#7c3aed;stroke:#e0f2fe;stroke-width:.7}
  .hf-eye-slit{stroke:#e0f2fe;stroke-width:1.3}
  .hf-horn{fill:#7c3aed;stroke:#e0f2fe;stroke-width:.6}
  .hf-hat{fill:#7c3aed;stroke:#e0f2fe;stroke-width:.8}
  .hf-crown{fill:#e0f2fe}
  .hf-halo{fill:none;stroke:#e0f2fe;stroke-width:1.4;opacity:.9}
  .hf-eye{fill:#e0f2fe;filter:drop-shadow(0 0 2px #e0f2fe)}
  .hf-wing{fill:#7c3aed;stroke:#e0f2fe;stroke-width:.7;opacity:.95}
  .hf-scarf{fill:#60a5fa;opacity:.9}
  .hf-float-orb{fill:#e0f2fe;filter:drop-shadow(0 0 5px #e0f2fe)}
  .hf-tail{fill:#60a5fa;opacity:.8}
  .hf-sigil{fill:#e0f2fe;opacity:.95}
  .hf-sigil-dot{fill:#070b16}
  .hf-sigil-ring{fill:none;stroke:#e0f2fe;stroke-width:1.4}
  .hf-sigil-line{stroke:#e0f2fe;stroke-width:1.5;fill:none;stroke-linecap:round}
  .hf-wpn-fill{fill:#e0f2fe;opacity:.96}
  .hf-wpn-line{stroke:#e0f2fe;stroke-width:2.2;stroke-linecap:round;fill:none}
  .hf-wpn-line.thin{stroke-width:1;opacity:.75}
  .hf-wpn-glow{fill:none;stroke:#e0f2fe;stroke-width:1;opacity:.35}
  .hf-shadow{fill:rgba(0,0,0,.5)}
</style>
</defs>
