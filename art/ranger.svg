<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640">
  <defs>
    <radialGradient id="aura" cx="50%" cy="47%" r="54%">
      <stop offset="0" stop-color="#fde68a" stop-opacity=".52"/>
      <stop offset=".38" stop-color="#93c5fd" stop-opacity=".18"/>
      <stop offset="1" stop-color="#1e3a8a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset=".45" stop-color="#0f2460"/>
      <stop offset="1" stop-color="#07152e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7cc"/>
      <stop offset=".35" stop-color="#fbbf24"/>
      <stop offset=".72" stop-color="#d97706"/>
      <stop offset="1" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#93a9c8"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe8d2"/>
      <stop offset="1" stop-color="#d9a47b"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#020617" flood-opacity=".55"/>
    </filter>
  </defs>

  <ellipse cx="240" cy="373" rx="210" ry="220" fill="url(#aura)" filter="url(#soft)"/>
  <ellipse cx="240" cy="596" rx="142" ry="20" fill="#020617" opacity=".5" filter="url(#soft)"/>

  <!-- constellation / stardust -->
  <g opacity=".78" stroke="#fde68a" stroke-width="1" fill="none">
    <path d="M80 176 L112 145 L150 154 L176 118"/>
    <path d="M338 124 L370 156 L406 146 L421 178"/>
    <path d="M104 438 L139 415 L166 436"/>
  </g>
  <g fill="#fef3c7" filter="url(#glow)">
    <circle cx="80" cy="176" r="3"/><circle cx="112" cy="145" r="2.3"/><circle cx="150" cy="154" r="2.7"/><circle cx="176" cy="118" r="2"/>
    <circle cx="338" cy="124" r="2.2"/><circle cx="370" cy="156" r="3"/><circle cx="406" cy="146" r="2"/><circle cx="421" cy="178" r="2.6"/>
    <circle cx="104" cy="438" r="2.5"/><circle cx="139" cy="415" r="1.8"/><circle cx="166" cy="436" r="2.2"/>
    <circle cx="70" cy="300" r="2"/><circle cx="414" cy="320" r="2.4"/><circle cx="384" cy="470" r="2"/><circle cx="90" cy="510" r="1.7"/>
  </g>

