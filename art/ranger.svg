  <ellipse cx="220" cy="181" rx="4" ry="2.6" fill="#1e3a8a"/>
  <ellipse cx="260" cy="181" rx="4" ry="2.6" fill="#1e3a8a"/>
  <path d="M231 207 Q240 213 249 207" stroke="#b4534b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M214 218 Q240 232 266 218" stroke="#fbbf24" stroke-width="3" fill="none"/>

  <!-- circlet + star gem -->
  <path d="M199 151 Q218 132 240 139 Q262 132 281 151 L272 160 Q258 146 240 151 Q222 146 208 160 Z" fill="url(#gold)" stroke="#fff7cc" stroke-width="2"/>
  <path d="M240 111 L246 127 L263 130 L250 142 L253 159 L240 150 L227 159 L230 142 L217 130 L234 127 Z" fill="#fde68a" stroke="#fbbf24" stroke-width="2" filter="url(#glow)"/>

