    <circle cx="220" cy="326" r="2.5"/><circle cx="258" cy="312" r="2"/><circle cx="274" cy="354" r="1.8"/>
    <circle cx="176" cy="352" r="1.6"/><circle cx="318" cy="336" r="2.2"/>
