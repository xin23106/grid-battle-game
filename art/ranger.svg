  <path d="M329 386 Q320 414 298 419 Q287 407 296 390 Z" fill="url(#skin)" stroke="#b9825c" stroke-width="2"/>

  <!-- bow (held left) -->
  <g filter="url(#glow)">
    <path d="M134 190 C76 272 76 446 134 528" fill="none" stroke="#fbbf24" stroke-width="10" stroke-linecap="round"/>
    <path d="M134 190 C86 272 86 446 134 528" fill="none" stroke="#fff7cc" stroke-width="3" stroke-linecap="round"/>
